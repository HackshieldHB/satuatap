services:
  mosquitto:
    image: eclipse-mosquitto:2
    platform: linux/arm64
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infrastructure/mosquitto/generated:/mosquitto/config/auth:ro

  iot-gateway:
    platform: linux/arm64
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/iot-gateway/Dockerfile
    depends_on:
      - mosquitto
    ports:
      - "3100:3100"
    volumes:
      - edge_db:/data
    environment:
      NODE_ENV: production
      PORT: "3100"
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_USERNAME: gateway
      MQTT_PASSWORD: ${MQTT_PASSWORD:-local-dev-mqtt-gateway}
      API_URL: ${API_URL:-http://api:3001}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-internal-key}
      EDGE_DB_PATH: /data/edge.sqlite
      EDGE_LOCAL_TOKEN: ${EDGE_LOCAL_TOKEN:-local-edge-token}
      HOME_ID: home-1
      OFFLINE_AFTER_MS: "45000"

  web:
    platform: linux/arm64
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - iot-gateway
    ports:
      - "80:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_ENABLE_MOCK_DATA: "false"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_EDGE_URL: /api/edge
      EDGE_URL: http://iot-gateway:3100
      EDGE_LOCAL_TOKEN: ${EDGE_LOCAL_TOKEN:-local-edge-token}

volumes:
  edge_db:
